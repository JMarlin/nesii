MEMORY {
    ENTRY_CODE:       start = $8100, size = $4,    type = ro, file = %O, fill = yes, fillval = $00;
    APPLICATION_CODE: start = $8104, size = $4ffc, type = ro, file = %O, fill = no; 
}

SEGMENTS {
    ENTRY: load = ENTRY_CODE,       type = ro, start = $8100;
    CODE:  load = APPLICATION_CODE, type = ro, start = $8104;
}
